[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-vla"
version = "0.1.0"
description = "Hyperspectral base-fine token transfer for frozen VLA models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Chih-Chung Hsu", email = "chihchung@nycu.edu.tw"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "scikit-learn>=1.6,<1.9", "torch>=2.6,<2.7", "threadpoolctl>=3.1"]

[project.optional-dependencies]
historical = ["PyYAML>=6,<7", "pandas>=2,<3", "h5py>=3,<4", "imageio==2.37.2", "torchvision==0.21.0", "Pillow==12.0.0"]
spatial = ["numpy==2.2.6", "transformers==4.47.0", "tokenizers==0.21.0", "accelerate==0.33.0", "safetensors>=0.6,<0.7", "torchvision==0.21.0", "Pillow==12.0.0", "imageio==2.37.2", "tifffile==2026.1.28", "sentencepiece==0.2.0"]
decoder = ["transformers==4.40.1", "accelerate==0.33.0", "safetensors>=0.6,<0.7", "tokenizers==0.19.1", "sentencepiece==0.2.0"]
vision = ["transformers==4.40.1", "accelerate==0.33.0", "safetensors>=0.6,<0.7", "timm==1.0.24", "torchvision==0.21.0", "Pillow==12.0.0", "imageio==2.37.2", "tifffile==2026.1.28", "sentencepiece==0.2.0"]

[tool.setuptools.packages.find]
include = ["spectra_vla*"]
